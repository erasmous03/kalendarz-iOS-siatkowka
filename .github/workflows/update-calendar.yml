name: Aktualizuj kalendarz reprezentacji

on:
  push:
    branches: [main]
    paths:
      - updater.py
      - .github/workflows/update-calendar.yml
  schedule:
    - cron: '23 7 * * *' # Codziennie 09:23/08:23 czasu polskiego (lato/zima).
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: polska-siatkowka-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdź terminarz CEV i zapisz dziennik
        id: refresh
        continue-on-error: true
        run: python updater.py
      - name: Zachowaj dziennik i zmiany w kalendarzu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/status.json data/history.jsonl site/calendar.ics site/status.json site/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Codzienna kontrola terminarza CEV"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Opublikuj kalendarz i logi
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Zgłoś błąd kontroli w historii Actions
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'CEV nie został odczytany. Ostatni poprawny kalendarz pozostał dostępny.' >&2
          exit 1
